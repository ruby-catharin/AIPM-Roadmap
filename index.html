<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mastery Roadmap</title>
    <meta name="description" content="A 5-week roadmap for AI product managers. Four depth levels per topic, interactive cost and reliability calculators, and knowledge checks." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Mastery Roadmap" />
    <meta property="og:description" content="A 5-week roadmap for AI product managers. Four depth levels per topic, interactive calculators, and knowledge checks." />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f0f0f'/%3E%3Cpath d='M9 22V10h3.2l3.3 8 3.3-8H22v12h-2.6v-7.6L16.6 22h-2.2l-2.8-7.6V22z' fill='%23fff'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    />

    <script>
      // Apply the persisted theme before first paint so dark mode never flashes white.
      try {
        var saved = JSON.parse(localStorage.getItem("roadmap-progress") || "null");
        var dark = saved && saved.state && typeof saved.state.darkMode === "boolean"
          ? saved.state.darkMode
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark-mode");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
